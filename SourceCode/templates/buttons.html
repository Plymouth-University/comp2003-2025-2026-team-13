    <title>Video UI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: left;
            align-items: left;
            height: 100vh;
            background-color: #c80085;
        }

        .container {
            text-align: left;
            margin-left: 20px;
        }

        .option {
            width: 200px;
            padding: 15px;
            margin: 15px;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .option:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="option" onclick="window.open('https://www.nhs.uk/nhs-services/services-near-you/', '_blank')">Call 999</div>
    <a href="/settings">Settings </a>
    <a href="Diagnostics.html">Diagnostics</a>
    <h2 id="activity"></h2>
</div>

</body>
</html>

</head>
<body>

    <video id="fp-Video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
    <script>
        //get the video footage
        const video = document.getElementById("fp-Video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        //start the webcam
        async function startWebcam() {
            try {
                //enable video with no audio
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
                video.srcObject = stream;
            } catch (error) {
                //denied when the camera is disabled
                alert("Denied.");
                console.error(error);
            }
        }
        

        let processing = false;
        //send the frame through the flask api
        function sendFrame() {
            //if processing is true cancel sending the next frame else set processing to true and begin
            if (processing) return;
            processing = true;
            //get the current frame
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const image = canvas.toDataURL("image/jpeg");

            //feed the image through post to the /process_frame end point
            fetch("/process_frame", {
                method: "POST",
                headers: {
                    "Content-Type" : "application/json"
                },
                body: JSON.stringify({
                    image:image
                })
            })
            //once a response is recieved print it into the interface
            .then(response => response.json())
            .then(data => {
                document.getElementById("activity").innerText =
                "Activity: " + data.activity;
                processing = false;
            })
            .catch(err => console.error(err));
        }
        //start the webcam and send the frame every 200 ms
        startWebcam();
        setInterval(sendFrame, 200);
    </script>

</body>
</html>
