    <title>Video UI</title>
    <style>
        body {
            font-family: Arial, sans-serif;

            justify-content: left;
            align-items: left;

        .option {

            cursor: pointer;
            transition: 0.3s;
        }

<body>

<div class="container">
    <div class="option" onclick="window.open('https://www.nhs.uk/nhs-services/services-near-you/', '_blank')">Call 999</div>
    <a class="MenuButton" href="Settings.html">Settings </a>

</div>

</head>
<body>

    <video id="fp-Video" autoplay playsinline></video>

    <script>
        const video = document.getElementById("fp-Video");

        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
                video.srcObject = stream;
            } catch (error) {
                alert("Denied.");
                console.error(error);
            }
        }

        startWebcam();
    </script>

</body>
